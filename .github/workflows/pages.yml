name: Synchronize and publish dashboard

on:
  workflow_dispatch:
  schedule:
    # 04:17 CEST / 03:17 CET, intentionally away from the full hour.
    - cron: "17 2 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: false

jobs:
  synchronize-and-deploy:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./data/festspielmonitor.db
      FUSSBALLDE_MATCHPLAN_SYNC_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Initialize monitored teams
        run: python -m app.seed

      - name: Synchronize FUSSBALL.DE
        run: python scripts/sync_fussballde.py

      - name: Export static dashboard data
        run: python scripts/export_dashboard.py --output frontend/public/dashboard.json

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        env:
          VITE_STATIC_DASHBOARD: "true"
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend build

      - name: Persist refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/festspielmonitor.db
          git diff --cached --quiet || git commit -m "chore: refresh FUSSBALL.DE data"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - uses: actions/deploy-pages@v4
